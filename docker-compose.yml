version: '3.8'

x-airflow-common: &airflow-common
  image: apache/airflow:3.1.1
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-shaty}:${POSTGRES_PASSWORD:-shaty05}@postgres:5432/${POSTGRES_DB:-weather_etl_db}
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CORE__STORE_DAG_CODE=true
    - AIRFLOW__CORE__STORE_SERIALIZED_DAGS=true
    - AIRFLOW_UID=${AIRFLOW_UID:-1000}
    - _PIP_ADDITIONAL_REQUIREMENTS=pandas aiohttp python-dotenv sqlalchemy psycopg2-binary
    - API_URL=${API_URL:-https://api.open-meteo.com/v1/forecast}
    - MAX_CON_FETCH=${MAX_CON_FETCH:-4}
    - DB_HOST=postgres
    - DB_PORT=5432
    - POSTGRES_USER=${POSTGRES_USER:-shaty}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-shaty05}
    - POSTGRES_DB=${POSTGRES_DB:-weather_etl_db}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shaty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shaty05}
      POSTGRES_DB: ${POSTGRES_DB:-weather_etl_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shaty} -d ${POSTGRES_DB:-weather_etl_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    network_mode: "host"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/data
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres_data:
  pgadmin_data:
  metabase_data:
